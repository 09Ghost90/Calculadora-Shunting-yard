<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Calculadora</title>
</head>

<body>
    <div class="calculadora"> <!-- Container principal -->
    <input type="text" id="display" value="0"> <!-- Visor usando INPUT -->

    <p id="mensagemErro" hidden></p>

    <div id="teclado"> <!-- Teclado com 20 Botões -->

        <!-- data-value: Propriedade estática do HTML que atribui um valor, pode ser acessada e alterada pelo JS, mas é fixa no HTML -->
        <button data-value="C">C</button>
        <button data-value="(">(</button>
        <button data-value=")">)</button>
        <button data-value="⌫">⌫</button>
        
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value="÷">÷</button>
        
        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="x">x</button>
        
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value="-">-</button>

        <button data-value="0">0</button>
        <button data-value=".">.</button>
        <button data-value="=">=</button>
        <button data-value="+">+</button>
    </div>
</div>
    
    <script src="./script.js"></script>

</body>
</html>
